name: Windows fixtures

# Regenerates the real-GDI/GDI+ reference fixtures (src/__fixtures__/gdi) on a
# Windows runner with scripts/gdi-fixtures/generate.ps1, uploads the new and
# changed files as an artifact, and pushes them to a windows-fixtures/<run_id>
# branch. It never touches main: merge the branch (or copy files from it) by
# hand. See scripts/gdi-fixtures/README.md.

on:
  workflow_dispatch:
    inputs:
      groups:
        description: >-
          Comma-separated case groups for generate.ps1: all, rop, gradient, text,
          pattern, rotation, rop2, image, rotation-affine, text-extra, gdi-raster,
          emfplus-records, gdiplus-extra, wmf-records, emf-records, halftone,
          emfplus-effects, pen-transform, halftone-mixed,
          color-adjustment-controls, illuminant-charts, halftone-dither, wmf-insideframe-curves;
          standalone: path-probe, wide-path-probe, wide-outline-probe, miter-limit-probe, gradient-blend-probe, image-codecs, image-codecs-extra, image-codecs-advanced,
          image-effects, image-effect-sharpen, image-effect-large-blur, image-effect-expanded-blur, image-effect-narrow-blur, image-effect-hue, image-effect-tint, illuminant-tables
        required: true
        default: emfplus-effects,halftone,pen-transform
        type: string
      push:
        description: Push the generated files to a windows-fixtures/<run_id> branch
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Keep checked-out bytes exactly as committed, so only files the
      # generator really changed show up as modified.
      - name: Disable line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install advanced TIFF encoder
        if: inputs.groups == 'image-codecs-advanced'
        run: python -m pip install "Pillow>=10.2"

      - name: Describe the runner
        shell: powershell
        run: |
          $PSVersionTable | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "OS: $([Environment]::OSVersion.VersionString)  image: $env:ImageOS $env:ImageVersion"
          Write-Host "gdiplus.dll: $((Get-Item "$env:WINDIR\System32\gdiplus.dll").VersionInfo.FileVersion)"
          Write-Host "gdi32.dll: $((Get-Item "$env:WINDIR\System32\gdi32.dll").VersionInfo.FileVersion)"
          Add-Type -AssemblyName System.Drawing
          $g = [System.Drawing.Graphics]::FromHwnd([IntPtr]::Zero)
          Write-Host "Screen DPI: $($g.DpiX) x $($g.DpiY)"
          $g.Dispose()

      # generate.ps1 compiles GdiFixtures.cs / PenTransformProbe.cs with
      # Add-Type, so it must run in Windows PowerShell 5.1 (.NET Framework
      # System.Drawing), not PowerShell 7.
      - name: Generate fixtures
        shell: powershell
        env:
          FIXTURE_GROUPS: ${{ inputs.groups }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/gdi-fixtures/generate.ps1 -Which "$env:FIXTURE_GROUPS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect new and changed fixtures
        id: collect
        shell: bash
        run: |
          git add -A -- src/__fixtures__/gdi
          git diff --cached --name-only --diff-filter=AM -- src/__fixtures__/gdi > "$RUNNER_TEMP/changed.txt"
          count=$(wc -l < "$RUNNER_TEMP/changed.txt" | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/windows-fixtures"
          while IFS= read -r f; do
            cp "$f" "$RUNNER_TEMP/windows-fixtures/"
          done < "$RUNNER_TEMP/changed.txt"
          {
            echo "### Windows fixtures ($count new or changed files)"
            echo
            echo "Groups: \`$FIXTURE_GROUPS\`"
            echo
            git diff --cached --name-status -- src/__fixtures__/gdi | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          FIXTURE_GROUPS: ${{ inputs.groups }}

      - name: Upload fixtures artifact
        if: steps.collect.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: windows-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-fixtures/
          if-no-files-found: error

      - name: Push to windows-fixtures/${{ github.run_id }}
        if: inputs.push && steps.collect.outputs.count != '0'
        shell: bash
        env:
          BRANCH: windows-fixtures/${{ github.run_id }}
          FIXTURE_GROUPS: ${{ inputs.groups }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -q \
            -m "test: Windows reference fixtures ($FIXTURE_GROUPS)" \
            -m "Generated by scripts/gdi-fixtures/generate.ps1 in workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID on $ImageOS $ImageVersion, from $GITHUB_SHA."
          git push origin "HEAD:refs/heads/$BRANCH"
          {
            echo
            echo "Pushed branch \`$BRANCH\` ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$BRANCH)."
          } >> "$GITHUB_STEP_SUMMARY"
