version: 2
updates:
  # Dependencies (package.json + bun.lock): tsup / typescript / vitest, etc.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Pinned: the GDI parity fixtures are measured against this exact
      # Skia build; 1.0.12+ (gradient dithering, Chrome raster blitters)
      # moves 23 exact effect/gradient fixtures. Bump with a parity pass.
      - dependency-name: "@napi-rs/canvas"
      # TypeScript 7 ships no compiler API; tsup's dts build and vue-tsc
      # still need it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the CI / publish / pages workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
