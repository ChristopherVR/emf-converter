version: 2
updates:
  # Dependencies (package.json + bun.lock): tsup / typescript / vitest, etc.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the CI / publish / pages workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
